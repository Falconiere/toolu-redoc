# GitHub Actions — automated AI code review on every pull request.
#
# The third guard rail, after the agent's own `bun run check` and the CI job.
# It reads the repo's own convention files (AGENTS.md and friends) from the BASE
# ref and reviews the diff against them, so the rules this kit installs are the
# rules the bot enforces — and a PR cannot rewrite the rules it is judged by.
#
# Setup (human-only): add an OPENROUTER_API_KEY repository secret.
# Inputs and defaults: https://github.com/falconiere/toolu-ghactions
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # uploads the secret-scan / SAST SARIF to Code Scanning

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # Draft PRs are skipped — mark ready for review to trigger the bot.
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the merge-base resolves

      - name: Review
        uses: falconiere/toolu-ghactions/code-review@v7
        with:
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Generated by `wrangler types`; not ours to review.
          EXCLUDE_GLOBS: "worker-configuration.d.ts"
          CODEBASE_OVERVIEW: >-
            @toolu-redoc/redoc is a client-side OpenAPI docs viewer (React +
            Vite SPA on Cloudflare Workers). Domains live under src/domains;
            routes in src/app are thin. Validation uses Zod; HTTP uses the
            shared utilities/http client (no axios, no bare fetch in domains).
            Vitest runs in Node (jsdom) and may use node:fs to load committed
            fixture bytes — that is test-only, never shipped to the browser.
            OpenAPI parse fixtures under domains/openapi/__tests__/fixtures
            intentionally include edge/invalid OAS cases for acceptance tests
            (duplicate tags/operationIds, optional path params, wrong-kind
            refs, depth chains); those are expected to parse or surface local
            notices per the epic support contract, not always fail Zod.

  # The `merge-gate` required check: the PR carries `merge-approved` and every
  # review thread has a reply from someone other than its opener. Evaluated
  # after the reviewer has posted, so a push is never judged against the
  # previous commit's findings; merge-gate.yml re-evaluates it on thread replies
  # and label changes. `!cancelled()`, not `always()`: a red `review` still
  # gets a verdict, but a run superseded by a newer push does not.
  merge-gate:
    needs: review
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: falconiere/toolu-ghactions/merge-gate@v8
