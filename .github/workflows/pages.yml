# GitHub Pages — publishes the apps/redoc demo at https://<owner>.github.io/<repo>/.
#
# Runs only after the CI workflow succeeds for a push to main in THIS repository
# (the base-path build is smoked inside CI, so a red main never publishes).
# The workflow_run `branches` filter matches the head branch name only, so the
# job guard also requires a `push` event from this repository — a fork PR whose
# branch happens to be called `main` must never deploy. Manual dispatch is
# honoured on the default branch only.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build (base path) · deploy
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the commit CI verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build:pages = vite build + 404.html (SPA fallback for deep paths) + .nojekyll
      - name: Build (apps/redoc, Pages base path)
        env:
          REDOC_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run --filter @toolu-redoc/redoc build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/redoc/dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
